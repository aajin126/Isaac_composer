schema_version: 1
name: spot
supported: true

nav2:
  params_file: config/params/nav2/spot.yaml
  rviz_file: rviz/spot_navigation.rviz

frames:
  map: map
  odom: odom
  base: base_link
  lidar: front_3d_lidar

topics:
  cmd_vel: cmd_vel
  odom: odom
  pointcloud: front_3d_lidar/lidar_points
  scan: scan

pointcloud_to_laserscan:
  enabled: true
  cloud_topic: front_3d_lidar/lidar_points
  scan_topic: scan
  parameters:
    queue_size: 1
    target_frame: front_3d_lidar
    transform_tolerance: 0.01
    min_height: -0.4
    max_height: 2.0
    angle_min: -1.5708
    angle_max: 1.5708
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.05
    range_max: 100.0
    use_inf: true
    inf_epsilon: 1.0
